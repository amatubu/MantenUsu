# テストの設定(python3 -m pytest で tests フォルダのテストを実行する)
[pytest]
testpaths = tests
addopts = -ra
markers =
    realdata: 手元の観測データ(daily_zips など)と外部ツールを使うテスト。無ければ飛ばす
filterwarnings =
    ignore::DeprecationWarning
    # ObsPy が SAC ファイルのサンプリング間隔(0.004 秒)を丸めたという知らせ。値は変わらない(アプリでも出る)
    ignore:Sample spacing read from SAC file:UserWarning
